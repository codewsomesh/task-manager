{% extends "base.html" %} {% block title %}Login — TaskManager{% endblock %} {%
block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>⚡ TaskManager</h1>
      <p>Sign in to your account</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          name="email"
          placeholder="you@example.com"
          required
        />
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            name="password"
            id="password"
            placeholder="••••••••"
            required
            oninput="handlePasswordInput('password')"
          />
          <button
            type="button"
            class="eye-btn"
            id="eye-password"
            onclick="togglePassword('password')"
            style="display: none"
          >
            👁️
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>
    <p class="auth-footer">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
  </div>
</div>

<script>
  function handlePasswordInput(id) {
    const input = document.getElementById(id);
    const eyeBtn = document.getElementById("eye-" + id);
    if (input.value.length > 0) {
      eyeBtn.style.display = "flex";
    } else {
      eyeBtn.style.display = "none";
      input.type = "password";
      eyeBtn.textContent = "👁️";
    }
  }

  function togglePassword(id) {
    const input = document.getElementById(id);
    const eyeBtn = document.getElementById("eye-" + id);
    if (input.type === "password") {
      input.type = "text";
      eyeBtn.textContent = "🙈";
    } else {
      input.type = "password";
      eyeBtn.textContent = "👁️";
    }
  }
</script>
{% endblock %}
